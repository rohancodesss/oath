[project]
name = "oath-transfer"
version = "0.0.1"
description = "OATH Allows Total History-transfer: a TUI for moving your own chat history between phones."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
    "textual>=0.80",
    "wa-crypt-tools>=0.1.0",
]

[project.scripts]
oath = "oath.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
